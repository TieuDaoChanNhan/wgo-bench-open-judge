[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subtask-eval"
version = "0.2.0"
description = "Evaluation harness for subtask annotation pipelines (segmentation + labels) in FineRobotics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyarrow>=15",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
subtask-eval = "subtask_eval.cli:main"

[tool.setuptools.packages.find]
include = ["subtask_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
