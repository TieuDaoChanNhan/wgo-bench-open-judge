[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wgo-eval"
version = "0.1.0"
description = "WGO-Bench subtask labeling evaluation with an open-weight judge"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyarrow>=15",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["wgo_eval"]
